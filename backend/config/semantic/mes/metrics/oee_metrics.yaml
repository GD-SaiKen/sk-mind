metrics:
  - metric: oee_avg
    display_name: OEE平均值
    description: 指定范围内设备 OEE 率的平均值。
    status: active
    formula: AVG(oee_rate)
    grain: machine
    dimensions:
      - machine_no
      - shift_name
      - sim_date
    source_object: oee_record
    caveats: oee_rate 来源于 MES 系统计算值。
    freshness_sla: 每日

  - metric: green_rate_avg
    display_name: 绿灯率平均值
    description: 设备绿灯运行时间占比的平均值（含关机时间在分母）。
    status: active
    formula: AVG(green_rate)
    grain: machine
    dimensions:
      - machine_no
      - shift_name
      - sim_date
    source_object: oee_record
    caveats: green_rate 已重算，灰灯(关机)放入分母。
    freshness_sla: 每日

  - metric: performance_rate_avg
    display_name: 性能率平均值
    description: 设备性能运行率的平均值。
    status: active
    formula: AVG(performance_rate)
    grain: machine
    dimensions:
      - machine_no
      - shift_name
      - sim_date
    source_object: oee_record
    caveats: 性能率来源于 MES OEE 报告。
    freshness_sla: 每日

  - metric: low_efficiency_rate
    display_name: 低效班次占比
    description: OEE < 0.6 的低效班次占全部班次的比例。
    status: active
    formula: "CAST(SUM(CASE WHEN is_low_efficiency THEN 1 ELSE 0 END) AS DECIMAL) / COUNT(*)"
    grain: machine
    dimensions:
      - machine_no
      - sim_date
    source_object: oee_record
    caveats: 低效阈值定义为 oee_rate < 0.6。
    freshness_sla: 每日

  - metric: fault_count_total
    display_name: 故障总次数
    description: 指定范围内设备故障发生的总次数。
    status: active
    formula: SUM(fault_count)
    grain: machine
    dimensions:
      - machine_no
      - shift_name
      - sim_date
    source_object: oee_record
    caveats: 仅统计 OEE 报告中的故障计数。
    freshness_sla: 每日
