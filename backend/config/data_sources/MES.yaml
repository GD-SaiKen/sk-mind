  # ── 设备域 ──
  # 17. selectOeeReport
  # 注意: OEE API 的日期参数名为 startDate/endDate（非浏览器前端的 startDateStr），
  # 日期参数必填（不传返回 code=1001 "查询时间不能空"），格式 "yyyy-MM-dd HH:mm:ss" 或 "yyyy-MM-dd"。
  - name: selectOeeReport
    endpoint: "/lightmesapi/open/trilightSummary/selectOeeReport"
    method: POST
    target_table: raw.mes_select_oee_report
    # OEE 报表按 设备(mid) + 报表日期(sim_date) + 班次(shift_name) 唯一。
    # 配置主键后引擎走 upsert，增量回放窗口重叠时幂等覆盖（数据补录/修订也只保留最新）。
    pk_fields: [mid, sim_date, shift_name]
    time_config:
      param_start: startDate
      param_end: endDate
      format: "%Y-%m-%d %H:%M:%S"
      is_time_based: true
    request_body_template:
      pageNum: 1
      pageSize: 100
      shiftName: ""
      did: ""
      machineNo: ""
      freeStatus: 0
    records_path: data
    total_path: totalItems
    reconciliation:
      enabled: true
      threshold_pct: 5
      auto_repair: false

